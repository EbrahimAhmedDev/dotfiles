# ==========================================
# HYPRLOCK — LUXURY MINIMAL
# Compatible with Hyprlock 0.9.7
# ==========================================

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = smooth, 0.25, 0.1, 0.25, 1.0
    animation = fadeIn, 1, 5, smooth
    animation = fadeOut, 1, 5, smooth
    animation = inputFieldDots, 1, 3, smooth
}

# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 6
    noise = 0.015
    contrast = 0.95
    brightness = 0.55
    vibrancy = 0.15
}

# MAIN GLASS CARD
shape {
    monitor =
    size = 440, 420
    color = rgba(12, 16, 26, 0.62)
    rounding = 28
    border_size = 1
    border_color = rgba(160, 180, 220, 0.22)
    position = 0, 0
    halign = center
    valign = center
}

# TOP LABEL
label {
    monitor =
    text = PRIVATE SESSION
    color = rgba(160, 180, 220, 0.85)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 145
    halign = center
    valign = center
}

# CLOCK
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(245, 247, 255)
    font_size = 92
    font_family = JetBrainsMono Nerd Font
    position = 0, 75
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A  /  %d %B"
    color = rgba(205, 215, 235, 0.75)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 12
    halign = center
    valign = center
}

# DIVIDER
shape {
    monitor =
    size = 90, 2
    color = rgba(110, 145, 210, 0.65)
    rounding = 2
    border_size = 0
    position = 0, -35
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = $USER
    color = rgb(235, 240, 250)
    font_size = 17
    font_family = JetBrainsMono Nerd Font
    position = 0, -72
    halign = center
    valign = center
}

# PASSWORD FIELD
input-field {
    monitor =
    size = 300, 54
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true

    outer_color = rgba(125, 155, 215, 0.65)
    inner_color = rgba(255, 255, 255, 0.07)
    font_color = rgb(240, 245, 255)

    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <i>Enter password</i>
    hide_input = false

    rounding = 14

    check_color = rgb(120, 190, 155)
    fail_color = rgb(220, 105, 110)
    fail_text = <i>Incorrect password</i>
    capslock_color = rgb(235, 190, 100)

    position = 0, -135
    halign = center
    valign = center
}

# KEYBOARD LAYOUT
label {
    monitor =
    text = $LAYOUT
    color = rgba(180, 195, 220, 0.65)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -185
    halign = center
    valign = center
}
