# ~/.config/hypr/hypridle.conf

# عشان السكون وقفل الشاشه 

general {
    # Dux Shell (DMS) lock screen — replaces hyprlock on this trial branch
    lock_cmd = dms ipc call lock lock
    before_sleep_cmd = dms ipc call lock lock
}


listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}


listener {
    timeout = 300
    on-timeout = dms ipc call lock lock
}


# NOTE: no DPMS-off listener — Hyprland 0.57.x crashes silently when outputs
# are powered off via DPMS (hyprwm/Hyprland discussion #16840). The dim at
# timeout=150 already protects the panel while idle.

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}