"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000
palette = "dotfiles"




format = """
[\ue0b6](fg:accent)\
$username\
[\ue0b0](fg:accent bg:bg_alt)\
$directory\
$git_branch\
$git_status\
${custom.git_end}\
${custom.nogit_end}\
$time\
[\ue0b4](fg:bg_hover) \
$python\
$nodejs\
$rust\
$golang\
$java\
$kotlin\
$php\
$c\
$cpp\
$dotnet\
$ruby\
$swift\
$dart\
$lua\
$perl\
$scala\
$elixir\
$haskell\
$zig\
$julia\
$crystal\
$elm\
$erlang\
$terraform\
$nix_shell\
$docker_context\
$kubernetes\
$aws\
$package\
$cmd_duration\
$jobs
$character"""

[username]
show_always = true
style_user = "bold fg:on_accent bg:accent"
style_root = "bold fg:on_accent bg:danger"
format = "[ \uf303 $user ]($style)"

[directory]
style = "fg:fg bg:bg_alt"
read_only = " \uf023"
read_only_style = "fg:danger bg:bg_alt"
home_symbol = "\uf015 ~"
truncation_length = 3
truncation_symbol = "…/"
format = "[ $path]($style)[$read_only]($read_only_style)[ ]($style)"

[git_branch]
symbol = "\ue0a0 "
style = "fg:accent_alt bg:bg_hover"
format = "[\ue0b0](fg:bg_alt bg:bg_hover)[ $symbol$branch ]($style)"

[git_status]
style = "fg:accent_alt bg:bg_hover"
format = "([$all_status$ahead_behind ]($style))"
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_state]
disabled = true

[git_metrics]
disabled = true


[custom.git_end]
when = "git rev-parse --is-inside-work-tree"
command = "echo 1"
format = "[\ue0b0](fg:bg_hover bg:bg_hover)"
shell = ["sh"]

[custom.nogit_end]
when = "! git rev-parse --is-inside-work-tree"
command = "echo 1"
format = "[\ue0b0](fg:bg_alt bg:bg_hover)"
shell = ["sh"]

[time]
disabled = false
time_format = "%H:%M"
style = "fg:good bg:bg_hover"
format = "[ \uf017 $time ]($style)"


[python]
symbol = "\ue73c "
style = "fg:warn"
format = '[$symbol($version )(\($virtualenv\) )]($style)'

[nodejs]
symbol = "\ue718 "
style = "fg:good"
format = "[$symbol($version )]($style)"

[rust]
symbol = "\ue7a8 "
style = "fg:danger"
format = "[$symbol($version )]($style)"

[golang]
symbol = "\ue626 "
style = "fg:accent"
format = "[$symbol($version )]($style)"

[java]
symbol = "\ue256 "
style = "fg:warn"
format = "[$symbol($version )]($style)"

[kotlin]
symbol = "\ue634 "
style = "fg:accent_alt"
format = "[$symbol($version )]($style)"

[php]
symbol = "\ue608 "
style = "fg:muted"
format = "[$symbol($version )]($style)"

[c]
symbol = "\ue61e "
style = "fg:accent"
format = "[$symbol($version(-$name) )]($style)"

[cpp]
disabled = false
symbol = "\ue61d "
style = "fg:accent"
format = "[$symbol($version(-$name) )]($style)"

[dotnet]
symbol = "\ue77f "
style = "fg:accent_alt"
format = "[$symbol($version )]($style)"

[ruby]
symbol = "\ue791 "
style = "fg:danger"
format = "[$symbol($version )]($style)"

[swift]
symbol = "\ue755 "
style = "fg:warn"
format = "[$symbol($version )]($style)"

[dart]
symbol = "\ue798 "
style = "fg:good"
format = "[$symbol($version )]($style)"

[lua]
symbol = "\ue620 "
style = "fg:accent"
format = "[$symbol($version )]($style)"

[perl]
symbol = "\ue769 "
style = "fg:accent_alt"
format = "[$symbol($version )]($style)"

[scala]
symbol = "\ue737 "
style = "fg:danger"
format = "[$symbol($version )]($style)"

[elixir]
symbol = "\ue62d "
style = "fg:accent_alt"
format = "[$symbol($version )]($style)"

[haskell]
symbol = "\ue777 "
style = "fg:accent_alt"
format = "[$symbol($version )]($style)"

[zig]
symbol = "\ue6a9 "
style = "fg:warn"
format = "[$symbol($version )]($style)"

[julia]
symbol = "\ue624 "
style = "fg:accent_alt"
format = "[$symbol($version )]($style)"

[crystal]
symbol = "\ue62f "
style = "fg:fg"
format = "[$symbol($version )]($style)"

[elm]
symbol = "\ue62c "
style = "fg:accent"
format = "[$symbol($version )]($style)"

[erlang]
symbol = "\ue7b1 "
style = "fg:danger"
format = "[$symbol($version )]($style)"

[terraform]
symbol = "\uf1bb "
style = "fg:accent_alt"
format = "[$symbol$workspace ]($style)"


[nix_shell]
symbol = "\uf313 "
style = "fg:accent"
format = "[$symbol$state ]($style)"

[docker_context]
symbol = "\uf308 "
style = "fg:accent"
format = "[$symbol$context ]($style)"

[kubernetes]
disabled = false
symbol = "☸ "
style = "fg:accent"
format = '[$symbol$context( \($namespace\)) ]($style)'

[aws]
symbol = "\ue7ad "
style = "fg:warn"
format = '[$symbol($profile )(\($region\) )]($style)'

[package]
symbol = "\uf487 "
style = "fg:warn"
format = "[$symbol$version ]($style)"

[cmd_duration]
min_time = 2000
style = "fg:warn"
format = "[\uf252 $duration ]($style)"

[jobs]
symbol = "\uf013 "
style = "fg:accent"
number_threshold = 1
format = "[$symbol$number ]($style)"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vimcmd_symbol = "[➜](bold yellow)"

[palettes.dotfiles]
accent = "#75f1fa"
accent_alt = "#c792ea"
bg = "#18181b"
bg_alt = "#27272a"
bg_hover = "#3f3f46"
fg = "#ffffff"
muted = "#a1a1aa"
on_accent = "#000000"
good = "#42ff9f"
warn = "#f1c40f"
danger = "#e35149"
