<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- الخط الأساسي: Noto Sans (الخط الافتراضي في Fedora KDE)
     العربية: Noto Sans Arabic (نفس عائلة Noto) -->
<fontconfig>

  <!-- 1) أي نص عربي (lang يحتوي ar) يستخدم Noto Sans Arabic -->
  <match target="pattern">
    <test compare="contains" name="lang">
      <string>ar</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>

  <!-- 2) fallback عام: أي خط عربي مفقود يرجع لـ Noto Sans Arabic -->
  <alias binding="weak">
    <family>sans-serif</family>
    <default><family>Noto Sans Arabic</family></default>
  </alias>
  <alias binding="weak">
    <family>serif</family>
    <default><family>Noto Naskh Arabic</family></default>
  </alias>
  <alias binding="weak">
    <family>monospace</family>
    <default><family>Noto Sans Arabic</family></default>
  </alias>

  <!-- 3) خطوط واجهات مشهورة تُطلب كتير: نضيف العربي في نهاية سلسلة البديل -->
  <alias binding="weak">
    <family>Adwaita Sans</family>
    <default><family>Noto Sans Arabic</family></default>
  </alias>
  <alias binding="weak">
    <family>Adwaita Sans Bold</family>
    <default><family>Noto Sans Arabic</family></default>
  </alias>
  <alias binding="weak">
    <family>Inter</family>
    <default><family>Noto Sans Arabic</family></default>
  </alias>
  <alias binding="weak">
    <family>Segoe UI</family>
    <default><family>Noto Sans Arabic</family></default>
  </alias>
  <alias binding="weak">
    <family>Tahoma</family>
    <default><family>Noto Sans Arabic</family></default>
  </alias>
  <alias binding="weak">
    <family>Arial</family>
    <default><family>Noto Sans Arabic</family></default>
  </alias>
  <alias binding="weak">
    <family>Helvetica</family>
    <default><family>Noto Sans Arabic</family></default>
  </alias>
  <alias binding="weak">
    <family>Roboto</family>
    <default><family>Noto Sans Arabic</family></default>
  </alias>
  <alias binding="weak">
    <family>Ubuntu</family>
    <default><family>Noto Sans Arabic</family></default>
  </alias>
  <alias binding="weak">
    <family>JetBrainsMono NF</family>
    <default><family>Noto Sans Arabic</family></default>
  </alias>

  <!-- 4) استبعاد خط Noto Nastaliq Urdu (خط أوردو ضخم غير مقروء للعربي)
       من اختيار fontconfig نهائياً -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Noto Nastaliq Urdu</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>

</fontconfig>
